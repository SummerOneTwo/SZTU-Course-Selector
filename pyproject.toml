[project]
name = "sztu-course-selector"
version = "3.0.0"
description = "深圳技术大学教务系统自动化选课工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SummerOneTwo"}
]
keywords = ["course-selection", "sztu", "automation", "education"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

dependencies = [
    "playwright>=1.58.0",
    "pycryptodome>=3.23.0",
    "requests>=2.32.5",
    "selenium>=4.41.0",
    "urllib3>=2.6.3",
    "tomli>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/SZTU-Course-Selector"
Issues = "https://github.com/yourusername/SZTU-Course-Selector/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
